name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        node-version:
          - "22.19.0"
          - "24"
          - "26"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      # The runtime image is only built by the release workflow, where a failure
      # leaves a published tag without an image. Build it here (no push) so a
      # broken Dockerfile fails on the pull request instead.
      - name: Build the runtime image (no push)
        if: matrix.os == 'ubuntu-latest'
        run: docker build --target runtime -t pi-coffee:ci .
  windows-startup:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run typecheck:extensions
      # Platform-neutral suites only; the rest of the suite exercises POSIX
      # process groups, bash and symlinks and is covered on ubuntu/macos.
      - run: node --test tests/startup-platform.test.mjs tests/env-parse.test.mjs tests/config-validation.test.mjs
      - shell: powershell
        run: |
          foreach ($path in @('deploy/windows/install.ps1', 'deploy/windows/install-task.ps1', 'deploy/windows/run-task.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { throw "$path has PowerShell syntax errors: $errors" }
          }
