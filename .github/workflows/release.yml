name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify the tag matches the package version
        shell: bash
        run: |
          node -e "const version = require('./package.json').version; const tag = process.env.GITHUB_REF_NAME || ''; if (tag !== 'v' + version) { console.error('tag ' + tag + ' does not match package version ' + version); process.exit(1); }"
      - run: npm run verify
      - name: Pack npm tarball
        run: npm pack
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured; skipping the npm publish step."
            exit 0
          fi
          npm publish --access public --provenance
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./pi-coffee-*.tgz \
            --title "pi-coffee $GITHUB_REF_NAME" \
            --generate-notes
      - name: Build and push container image
        env:
          REGISTRY: ghcr.io
        run: |
          image="$REGISTRY/${GITHUB_REPOSITORY,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          docker build -t "$image:$GITHUB_REF_NAME" -t "$image:latest" .
          docker push "$image:$GITHUB_REF_NAME"
          docker push "$image:latest"
