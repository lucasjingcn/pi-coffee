name: pi-coffee

services:
  pi-coffee:
    build: .
    image: pi-coffee:latest
    restart: unless-stopped
    ports:
      # Loopback only by default. Change to 0.0.0.0:8787 (with a token) to expose it.
      - "127.0.0.1:${PI_COFFEE_PORT:-8787}:${PI_COFFEE_PORT:-8787}"
    env_file:
      - .env
    environment:
      PI_COFFEE_HOST: 0.0.0.0
      PI_COFFEE_DEFAULT_REPO: /workspace
    volumes:
      # Daemon state (locks, mailbox, board, session metadata).
      - pi-coffee-data:/data
      # Repositories the workers operate on. Put or clone a repo here.
      - ./workspace:/workspace
    healthcheck:
      test: ["CMD", "node", "scripts/container-health.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pi-coffee-data:
